[package]
name = "ar1s_launcher"
version = "0.6.2"
description = "Ar1s Launcher"
authors = ["JDBeWL"]
edition = "2024"
rust-version = "1.95.0"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ar1s_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
uuid = { version = "1.28", features = ["v3"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-fs = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-http = "2.8"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"
serde_urlencoded = "0.7"
rand = "0.10"
tokio = { version = "1", features = ["full"] }
zip = "9.0"
thiserror = "2"
log = "0.4"
fern = "0.7"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
sysinfo = "0.39"
num_cpus = "1.17"
opener = "0.9"
tempfile = "3"

[dev-dependencies]

