<!doctype html>
<!-- 書いては消してを繰り返す/写了又删 删了又写 - 《夢我夢中》 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 必须最先声明 @layer 顺序：组件样式进共享 chunk、main.css 进入口 chunk 反而后加载，缺这里层序会颠倒成 components < core.reset，
         reset 的 button { font: inherit } 就盖掉按钮字号 -->
    <style>
      @layer vuetify-core {
        @layer reset, base;
      }
      @layer vuetify-components;
      @layer vuetify-overrides;
      @layer vuetify-utilities {
        @layer theme-base, typography, helpers, theme-background, theme-foreground;
      }
      @layer vuetify-final {
        @layer transitions, trumps;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/icons/grass_block.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ar1s Launcher</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
