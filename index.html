<!doctype html>
<!-- 書いては消してを繰り返す/写了又删 删了又写 - 《夢我夢中》 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      锁定 Vuetify 的 @layer 级联顺序，必须最先解析。
      @layer 的优先级由层名「首次出现」的先后顺序决定，与选择器权重无关。
      构建时 Vuetify 组件样式会被打进共享 chunk（如 forwardRefs.css），
      而声明层顺序的 main.css 落在入口 chunk，后者在 HTML 中反而后加载 ——
      若不在这里预先声明，层顺序就被颠倒成 components < core.reset，
      于是 reset 里的 button { font: inherit } 会盖掉按钮的字号与字重。
    -->
    <style>
      @layer vuetify-core {
        @layer reset, base;
      }
      @layer vuetify-components;
      @layer vuetify-overrides;
      @layer vuetify-utilities {
        @layer theme-base, typography, helpers, theme-background, theme-foreground;
      }
      @layer vuetify-final {
        @layer transitions, trumps;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/icons/grass_block.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ar1s Launcher</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
